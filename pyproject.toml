[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-evolution"
version = "0.1.0"
description = "Auditable schema evolution and fuzzy data-quality processing for multi-source JSONL pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deap>=1.4.1,<2",
    "numpy>=1.26,<3",
    "questionary>=2,<3",
    "rich>=13,<15",
    "scikit-fuzzy>=0.5,<1",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
schema-evolution = "schema_evolution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
